<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Task list representation -->
  <rect x="16" y="12" width="32" height="40" rx="4" fill="url(#iconGradient)" opacity="0.95"/>
  
  <!-- Task items -->
  <rect x="20" y="18" width="24" height="3" rx="1.5" fill="#667eea"/>
  <rect x="20" y="24" width="20" height="3" rx="1.5" fill="#764ba2"/>
  <rect x="20" y="30" width="22" height="3" rx="1.5" fill="#667eea"/>
  <rect x="20" y="36" width="18" height="3" rx="1.5" fill="#764ba2"/>
  <rect x="20" y="42" width="26" height="3" rx="1.5" fill="#667eea"/>
  
  <!-- Checkmark for completed task -->
  <circle cx="44" cy="19.5" r="2" fill="#10b981"/>
  <path d="M42.5 19.5L43.5 20.5L45.5 18.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Hierarchy indicator -->
  <circle cx="12" cy="32" r="3" fill="#fbbf24"/>
  <circle cx="20" cy="32" r="2" fill="#fbbf24"/>
  <circle cx="28" cy="32" r="2" fill="#fbbf24"/>
  <line x1="15" y1="32" x2="18" y2="32" stroke="#fbbf24" stroke-width="2"/>
  <line x1="23" y1="32" x2="26" y2="32" stroke="#fbbf24" stroke-width="2"/>
  
  <!-- Nano indicator -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">NANO</text>
</svg> 